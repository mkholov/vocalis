name: Tauri app (Windows build)

# Builds the tauri-app/ prototype (React + TypeScript + Tailwind frontend,
# Tauri/Rust shell) on a real Windows host. Entirely separate crate/workspace
# from the egui apps built by windows-build.yml — see tauri-app/src-tauri's
# own `[workspace]` table — so this job doesn't touch, depend on, or share a
# cache with that one.

on:
  push:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  pull_request:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: npm ci
        run: npm ci

      # Step 2 of the Tauri migration (vocalis_roadmap.md, section 8): Tauri
      # commands bridging to the existing Rust core (vocalis/lingua-common —
      # DB, network, audio, screen capture). These run the real command
      # dispatch through Tauri's MockRuntime (see src-tauri/tests/command_bridge.rs
      # — an integration test on purpose: only test executables of that kind can
      # get the Common Controls v6 manifest build.rs embeds, without which the
      # exe dies at startup with 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND on
      # Windows) — no window/display needed, so this is safe to run
      # on a headless CI runner exactly like a real webview `invoke()` call.
      #
      # --test-threads=1: step 7 added a test that mutates the process-global
      # HOME/APPDATA env vars (to keep its real DB write out of a real user's
      # data dir — see start_teacher_session_creates_a_real_class_and_pin) —
      # running concurrently with the read-only `list_classes` test races on
      # that same env var and flakes (confirmed locally: 1-in-3ish). These
      # tests are few and fast, so serializing them costs nothing noticeable.
      - name: cargo test (Tauri command bridge)
        working-directory: tauri-app/src-tauri
        run: cargo test --locked -- --test-threads=1

      # No extra system packages needed on windows-latest: Tauri v2's Windows
      # webview is WebView2, which ships with (or is auto-installed alongside)
      # the runner image, and the MSI/NSIS bundlers Tauri CLI drives are
      # fetched by the CLI itself on first use. `vocalis`'s own Windows-only
      # deps (wasapi, openh264's "source" build) already build clean on this
      # same runner image for the egui apps in windows-build.yml.
      #
      # Still uses Tauri's own bundler (not just `cargo build --release`)
      # rather than skip it: `npm run tauri build` is what actually runs
      # `beforeBuildCommand` (`npm run build`, the frontend dist Tauri embeds
      # at compile time) for us, and its own NSIS/MSI output is what this
      # workflow's earlier version used to ship — see installer/vocalis.iss's
      # own doc comment for why that output isn't what gets shipped anymore
      # (per-user install, no Program Files, two confusingly-different
      # installers for one app). The plain release .exe it also produces
      # along the way (target/release/tauri-app.exe) is real either way — the
      # same file Tauri's own bundler would have wrapped.
      - name: npm run tauri build
        run: npm run tauri build

      # Single source of truth for the installer's version: read straight out
      # of tauri.conf.json rather than hardcoding it a second time in
      # installer/vocalis.iss, so the two can't silently drift apart.
      - name: Read app version from tauri.conf.json
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      # windows-latest ships Chocolatey; Inno Setup isn't preinstalled but is a
      # standard choco package — this is the same "fetch a well-known package
      # on the runner" approach windows-build.yml's own comment describes for
      # why nothing extra is normally needed (this is the one real exception).
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: iscc /DMyAppVersion=${{ steps.app_version.outputs.version }} installer\vocalis.iss

      # Not a full unattended run of the real product (no window/display
      # needed, matching this workflow's own "cargo test" step above) — just
      # proof the installer Inno Setup produced actually installs a real file
      # to a real path and the uninstaller actually removes it, using Inno
      # Setup's own documented silent-install switches
      # (https://jrsoftware.org/ishelp/topic_setupcmdline.htm). `unins000.exe`
      # is known to re-spawn a copy of itself and return before that copy
      # finishes (see its own Inno Setup docs) — polling for the file's
      # removal rather than trusting `-Wait` to mean "done" avoids a flaky
      # false failure here.
      - name: Silently test-install the built installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "installer\Output\*.exe" | Select-Object -First 1).FullName
          $testDir = "C:\VocalisInstallTest"
          Write-Host "Installing $setup -> $testDir"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$testDir" -Wait
          if (!(Test-Path "$testDir\Vocalis.exe")) { throw "Vocalis.exe missing after a silent install — installer did not actually install the app" }
          if (!(Test-Path "$testDir\unins000.exe")) { throw "no uninstaller after a silent install" }
          Write-Host "Real silent install OK: $testDir\Vocalis.exe and its uninstaller both present"

      - name: Silently uninstall and verify real removal
        shell: pwsh
        run: |
          $testDir = "C:\VocalisInstallTest"
          Start-Process -FilePath "$testDir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$testDir\Vocalis.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path "$testDir\Vocalis.exe") { throw "Vocalis.exe still present 30s after a silent uninstall" }
          Write-Host "Real silent uninstall OK: Vocalis.exe actually removed"

      - name: Upload Vocalis installer
        uses: actions/upload-artifact@v4
        with:
          name: vocalis-windows-setup
          path: tauri-app/installer/Output/*.exe
          if-no-files-found: error
