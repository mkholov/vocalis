name: Tauri app (Windows build)

# Builds the tauri-app/ prototype (React + TypeScript + Tailwind frontend,
# Tauri/Rust shell) on a real Windows host. Entirely separate crate/workspace
# from the egui apps built by windows-build.yml — see tauri-app/src-tauri's
# own `[workspace]` table — so this job doesn't touch, depend on, or share a
# cache with that one.

on:
  push:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  pull_request:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: npm ci
        run: npm ci

      # Step 2 of the Tauri migration (vocalis_roadmap.md, section 8): Tauri
      # commands bridging to the existing Rust core (vocalis/lingua-common —
      # DB, network, audio, screen capture). These run the real command
      # dispatch through Tauri's MockRuntime (see src-tauri/tests/command_bridge.rs
      # — an integration test on purpose: only test executables of that kind can
      # get the Common Controls v6 manifest build.rs embeds, without which the
      # exe dies at startup with 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND on
      # Windows) — no window/display needed, so this is safe to run
      # on a headless CI runner exactly like a real webview `invoke()` call.
      #
      # --test-threads=1: step 7 added a test that mutates the process-global
      # HOME/APPDATA env vars (to keep its real DB write out of a real user's
      # data dir — see start_teacher_session_creates_a_real_class_and_pin) —
      # running concurrently with the read-only `list_classes` test races on
      # that same env var and flakes (confirmed locally: 1-in-3ish). These
      # tests are few and fast, so serializing them costs nothing noticeable.
      - name: cargo test (Tauri command bridge)
        working-directory: tauri-app/src-tauri
        run: cargo test --locked -- --test-threads=1

      # No extra system packages needed on windows-latest: Tauri v2's Windows
      # webview is WebView2, which ships with (or is auto-installed alongside)
      # the runner image, and the NSIS bundler Tauri CLI drives is fetched by
      # the CLI itself on first use. `vocalis`'s own Windows-only deps (wasapi,
      # openh264's "source" build) already build clean on this same runner
      # image for the egui apps in windows-build.yml.
      #
      # tauri.conf.json now builds Tauri's own NSIS installer (installMode
      # "perMachine" — Program Files, admin, real Start Menu/desktop
      # shortcuts, real uninstaller) instead of a custom Inno Setup script —
      # see the real reason in this task's own report: tauri-plugin-updater's
      # silent self-update on Windows only knows how to drive an installer
      # *Tauri's own bundler* produced (it passes it NSIS-specific `/P
      # /UPDATE /R` flags), so a third-party installer would have silently
      # broken auto-update.
      #
      # `createUpdaterArtifacts: true` (tauri.conf.json) means `tauri build`
      # normally also produces a signed `.sig` next to the `.exe` — and
      # refuses to build at all without a real private key to sign with. This
      # ordinary build/test job has no business holding that key (it's a
      # secret, scoped to real releases only — see
      # tauri-windows-release.yml), so this override turns updater-artifact
      # creation back off just for this job: it only needs to prove the app
      # still builds and bundles, not produce something installable/shippable.
      - name: npm run tauri build (unsigned, build/test only)
        run: npm run tauri build -- --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - name: Upload the unsigned NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-windows-installer
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
