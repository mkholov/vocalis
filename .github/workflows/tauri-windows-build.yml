name: Tauri app (Windows build)

# Builds the tauri-app/ prototype (React + TypeScript + Tailwind frontend,
# Tauri/Rust shell) on a real Windows host. Entirely separate crate/workspace
# from the egui apps built by windows-build.yml — see tauri-app/src-tauri's
# own `[workspace]` table — so this job doesn't touch, depend on, or share a
# cache with that one.

on:
  push:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  pull_request:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: npm ci
        run: npm ci

      # Step 2 of the Tauri migration (vocalis_roadmap.md, section 8): Tauri
      # commands bridging to the existing Rust core (vocalis/lingua-common —
      # DB, network, audio, screen capture). These run the real command
      # dispatch through Tauri's MockRuntime (see src-tauri/src/lib.rs's
      # `tests` module) — no window/display needed, so this is safe to run
      # on a headless CI runner exactly like a real webview `invoke()` call.
      #
      # --test-threads=1: step 7 added a test that mutates the process-global
      # HOME/APPDATA env vars (to keep its real DB write out of a real user's
      # data dir — see start_teacher_session_creates_a_real_class_and_pin) —
      # running concurrently with the read-only `list_classes` test races on
      # that same env var and flakes (confirmed locally: 1-in-3ish). These
      # tests are few and fast, so serializing them costs nothing noticeable.
      - name: cargo test (Tauri command bridge)
        working-directory: tauri-app/src-tauri
        run: cargo test --locked -- --test-threads=1

      # No extra system packages needed on windows-latest: Tauri v2's Windows
      # webview is WebView2, which ships with (or is auto-installed alongside)
      # the runner image, and the MSI/NSIS bundlers Tauri CLI drives are
      # fetched by the CLI itself on first use. `vocalis`'s own Windows-only
      # deps (wasapi, openh264's "source" build) already build clean on this
      # same runner image for the egui apps in windows-build.yml.
      - name: npm run tauri build
        run: npm run tauri build

      - name: Upload bundled installers
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-windows-bundle
          path: tauri-app/src-tauri/target/release/bundle/**
          if-no-files-found: error
