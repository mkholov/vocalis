name: Tauri app (Windows build)

# Builds the tauri-app/ prototype (React + TypeScript + Tailwind frontend,
# Tauri/Rust shell) on a real Windows host. Entirely separate crate/workspace
# from the egui apps built by windows-build.yml — see tauri-app/src-tauri's
# own `[workspace]` table — so this job doesn't touch, depend on, or share a
# cache with that one.

on:
  push:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  pull_request:
    branches: [main]
    paths: ["tauri-app/**", ".github/workflows/tauri-windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: npm ci
        run: npm ci

      # Step 2 of the Tauri migration (vocalis_roadmap.md, section 8): Tauri
      # commands bridging to the existing Rust core (vocalis/lingua-common —
      # DB, network, audio, screen capture). These run the real command
      # dispatch through Tauri's MockRuntime (see src-tauri/tests/command_bridge.rs
      # — an integration test on purpose: only test executables of that kind can
      # get the Common Controls v6 manifest build.rs embeds, without which the
      # exe dies at startup with 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND on
      # Windows) — no window/display needed, so this is safe to run
      # on a headless CI runner exactly like a real webview `invoke()` call.
      #
      # --test-threads=1: step 7 added a test that mutates the process-global
      # HOME/APPDATA env vars (to keep its real DB write out of a real user's
      # data dir — see start_teacher_session_creates_a_real_class_and_pin) —
      # running concurrently with the read-only `list_classes` test races on
      # that same env var and flakes (confirmed locally: 1-in-3ish). These
      # tests are few and fast, so serializing them costs nothing noticeable.
      # --nocapture (temporary, diagnostic — see this task's own investigation notes on the e9b20c8
      # regression): shows every test's real output (not just failing ones' captured output), including
      # the new `[diag] ...` prints and the now-visible `tracing` output from `app`/`common`
      # (`init_test_tracing` in `tests/command_bridge.rs`), so a real Windows CI run gives the full,
      # ordered picture of what every teacher/student control-server connection actually did.
      - name: cargo test (Tauri command bridge)
        working-directory: tauri-app/src-tauri
        run: cargo test --locked -- --test-threads=1 --nocapture

      # No extra system packages needed on windows-latest: Tauri v2's Windows
      # webview is WebView2, which ships with (or is auto-installed alongside)
      # the runner image, and the NSIS bundler Tauri CLI drives is fetched by
      # the CLI itself on first use. `vocalis`'s own Windows-only deps (wasapi,
      # openh264's "source" build) already build clean on this same runner
      # image for the egui apps in windows-build.yml.
      #
      # tauri.conf.json now builds Tauri's own NSIS installer (installMode
      # "perMachine" — Program Files, admin, real Start Menu/desktop
      # shortcuts, real uninstaller) instead of a custom Inno Setup script —
      # see the real reason in this task's own report: tauri-plugin-updater's
      # silent self-update on Windows only knows how to drive an installer
      # *Tauri's own bundler* produced (it passes it NSIS-specific `/P
      # /UPDATE /R` flags), so a third-party installer would have silently
      # broken auto-update.
      #
      # `createUpdaterArtifacts: true` (tauri.conf.json) means `tauri build`
      # normally also produces a signed `.sig` next to the `.exe` — and
      # refuses to build at all without a real private key to sign with. This
      # ordinary build/test job has no business holding that key (it's a
      # secret, scoped to real releases only — see
      # tauri-windows-release.yml), so this override turns updater-artifact
      # creation back off just for this job: it only needs to prove the app
      # still builds and bundles, not produce something installable/shippable.
      #
      # `--config` takes a path here, not an inline JSON string: an earlier
      # version tried `--config "{\"bundle\":...}"`, which needs *shell*
      # escaping for the embedded quotes, and this step's default shell on a
      # Windows runner is `pwsh`, not bash — the backslash-escaped quotes
      # never reached `tauri build` as valid JSON, so the step just failed on
      # argument/JSON parsing before doing anything real. A path (see
      # `src-tauri/tauri.build-only.conf.json`) sidesteps shell quoting
      # entirely — same override, portable to any shell.
      - name: npm run tauri build (unsigned, build/test only)
        run: npm run tauri build -- --config src-tauri/tauri.build-only.conf.json

      - name: Upload the unsigned NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-windows-installer
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Step 9 ("режим кабинета"): `installer-hooks.nsh` adds two Windows Firewall rules on install and
      # removes them on uninstall (so a student's first real lesson never hits Windows' own "разрешить
      # доступ?" prompt). Real proof this works — a real silent install, a real `netsh` lookup against the
      # real Windows Firewall this runner has, not a read of the .nsh source and a guess. Matched on the
      # rule's own name *appearing in* `netsh`'s real output, not on its exit code — that code's "not
      # found" semantics aren't reliably documented across Windows versions, but the rule's name only ever
      # appears in the output if `show rule` actually found and printed it.
      - name: Silently install and verify the real firewall rules were added
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1).FullName
          Write-Host "Installing $exe"
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait

          if (!(Test-Path "C:\Program Files\Vocalis")) { throw "install directory not found after a silent install" }

          $tcp = netsh advfirewall firewall show rule name="Vocalis TCP 47991" 2>&1 | Out-String
          if ($tcp -notmatch "Vocalis TCP 47991") { throw "TCP firewall rule missing after install. netsh output:`n$tcp" }
          $udp = netsh advfirewall firewall show rule name="Vocalis UDP 47990 47992-47998" 2>&1 | Out-String
          if ($udp -notmatch "Vocalis UDP 47990 47992-47998") { throw "UDP firewall rule missing after install. netsh output:`n$udp" }
          Write-Host "Real firewall rules confirmed present after a real silent install."

      # NSIS's own uninstaller can't delete its own running .exe, so the standard pattern (which Tauri's
      # bundled uninstaller follows) is to copy itself into %TEMP% and re-launch from there — the
      # *original* process (the one `-Wait` actually waits on) exits almost immediately, well before the
      # re-launched copy has actually finished running NSIS_HOOK_POSTUNINSTALL's netsh delete calls. A
      # fixed sleep after `-Wait` is therefore a guess at how long that takes, not a real check; this polls
      # the actual thing being verified (the rules genuinely gone) up to a generous deadline instead.
      - name: Silently uninstall and verify the real firewall rules were removed
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem -Path "C:\Program Files\Vocalis" -Filter "*ninstall*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw "no uninstaller found under C:\Program Files\Vocalis" }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait

          $deadline = (Get-Date).AddSeconds(60)
          $tcpGone = $false
          $udpGone = $false
          $tcp = ""
          $udp = ""
          while ((Get-Date) -lt $deadline -and -not ($tcpGone -and $udpGone)) {
            $tcp = netsh advfirewall firewall show rule name="Vocalis TCP 47991" 2>&1 | Out-String
            $tcpGone = $tcp -notmatch "Vocalis TCP 47991"
            $udp = netsh advfirewall firewall show rule name="Vocalis UDP 47990 47992-47998" 2>&1 | Out-String
            $udpGone = $udp -notmatch "Vocalis UDP 47990 47992-47998"
            if (-not ($tcpGone -and $udpGone)) { Start-Sleep -Seconds 2 }
          }
          if (-not $tcpGone) { throw "TCP firewall rule still present 60s after a silent uninstall. netsh output:`n$tcp" }
          if (-not $udpGone) { throw "UDP firewall rule still present 60s after a silent uninstall. netsh output:`n$udp" }
          Write-Host "Real firewall rules confirmed removed after a real silent uninstall."
