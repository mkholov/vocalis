[package]
name = "vocalis"
version.workspace = true
edition.workspace = true

[lib]
name = "vocalis"
path = "src/lib.rs"

# Shared library only — no binaries here. The three user-facing .exe live in their own
# packages (bin-launcher, bin-teacher, bin-student) so each can embed its own distinct
# icon via a per-package build.rs; a single package's build script can't vary by which
# binary is being linked.

[dependencies]
lingua-common = { path = "../common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
open = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
# Pinned to the 0.5 series deliberately: 0.6 reworked the public API significantly
# (moved/renamed most of what we need — Hint, SampleBuffer, decoder construction —
# and is only a few months old), while 0.5's API is the long-stable, widely-used one.
# default-features off to skip formats we don't need (flac/ogg/vorbis/mkv/adpcm).
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3"] }
# Teacher profile password hashing. Picked over argon2 deliberately: the threat
# model here is "don't let someone who walks up to an offline school PC see the
# class", not resisting a serious offline attacker with the SQLite file in hand —
# for that, plain salted+iterated SHA-256 (see teacher::auth) is minimal-weight
# and enough; argon2 would be the right call if this ever needs to be stronger.
sha2 = "0.11"
# Screen-demo video codec. `source` builds Cisco's C encoder/decoder from
# source via `cc`/`nasm-rs` — no system lib or Windows dll download needed;
# already verified to build on both macOS and Windows (see `codec-check/`).
openh264 = { version = "0.9", features = ["source"] }

# Teacher's system-audio (WASAPI loopback) capture during a screen demo —
# Windows-only, same pattern as winres in bin-*/Cargo.toml. `wasapi` (by the
# CamillaDSP author) is a small, focused wrapper purpose-built for this exact
# loopback-capture use case, rather than a general cross-platform audio crate
# bolting loopback on as an afterthought.
[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
