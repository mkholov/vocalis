[workspace]
resolver = "2"
members = ["common", "app", "bin-launcher", "bin-teacher", "bin-student"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
audiopus = "0.2"
chacha20poly1305 = "0.11"
sha2 = "0.11"
