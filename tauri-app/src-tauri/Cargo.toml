[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Own workspace root, deliberately not a member of the repo's main
# (egui/eframe) Cargo workspace at ../../Cargo.toml — keeps this prototype's
# dependency graph (and its own Cargo.lock) fully independent of app/common's,
# rather than sharing one big lockfile across two unrelated toolchains.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Already in the tree (tauri-build -> tauri-winres uses it); see build.rs for why a
# second, tests-only resource is compiled with it.
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }

# Step 7 part B (vocalis_roadmap.md, section 8): re-encoding a decoded video
# frame to JPEG for the webview, and base64-framing it for `emit`/`listen` —
# see ../video-bench/'s benchmark for why this transport was chosen over
# `tauri::ipc::Channel`. Same two crates that benchmark already used.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

# The existing Rust core, reused as-is (not reimplemented): `vocalis` is the
# same crate the egui teacher/student binaries link against (its DB, network,
# audio-device, and screen-capture modules have no egui/eframe dependency —
# only the UI screens themselves do, see the step-2 write-up), and
# `lingua-common` is the shared network protocol/discovery crate both roles
# already use. Pulling in `vocalis` does also drag its egui/eframe/rusqlite
# dependency tree into this build even though nothing here renders with them
# — acceptable for this bridge step, worth revisiting if it noticeably slows
# down CI or bundle size later.
vocalis = { path = "../../app" }
lingua-common = { path = "../../common" }

[dev-dependencies]
# "test" gets `tauri::test` (MockRuntime + real IPC dispatch, no window needed) —
# see src/lib.rs's `tests` module.
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
